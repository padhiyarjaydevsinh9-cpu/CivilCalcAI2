
</body>
</html><!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CivilCalcAI</title>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f2f5f9;
  color:#222;
}

header{
  background:#0d47a1;
  color:white;
  padding:25px 15px;
  text-align:center;
}

header h1{
  margin:0;
  font-size:30px;
}

header p{
  margin:8px 0 0;
}

.container{
  max-width:700px;
  margin:20px auto;
  padding:15px;
}

.card{
  background:white;
  padding:20px;
  margin-bottom:20px;
  border-radius:12px;
  box-shadow:0 3px 10px rgba(0,0,0,.1);
}

.card h2{
  color:#0d47a1;
}

label{
  display:block;
  margin-top:12px;
  font-weight:bold;
}

input{
  width:100%;
  padding:12px;
  margin-top:6px;
  box-sizing:border-box;
  border:1px solid #ccc;
  border-radius:7px;
  font-size:16px;
}

button{
  width:100%;
  margin-top:15px;
  padding:13px;
  border:0;
  border-radius:7px;
  background:#0d47a1;
  color:white;
  font-size:17px;
}

.result{
  margin-top:15px;
  padding:12px;
  background:#e8f1ff;
  border-radius:7px;
  font-weight:bold;
}
</style>
</head>

<body>

<header>
<h1>🏗️ CivilCalcAI</h1>
<p>AI-powered Civil Engineering Calculator</p>
</header>

<div class="container">

<div class="card">
<h2>🧱 Concrete Volume</h2>

<label>Length (m)</label>
<input type="number" id="length" placeholder="Example: 5">

<label>Width (m)</label>
<input type="number" id="width" placeholder="Example: 3">

<label>Depth (m)</label>
<input type="number" id="depth" placeholder="Example: 0.15">

<button onclick="calculateConcrete()">Calculate Volume</button>

<div class="result" id="concreteResult"></div>
</div>


<div class="card">
<h2>🧱 Brick Calculator</h2>

<label>Wall Length (m)</label>
<input type="number" id="wallLength" placeholder="Example: 5">

<label>Wall Height (m)</label>
<input type="number" id="wallHeight" placeholder="Example: 3">

<button onclick="calculateBricks()">Calculate Bricks</button>

<div class="result" id="brickResult"></div>
</div>


<div class="card">
<h2>🔩 Steel Weight Calculator</h2>

<label>Steel Diameter (mm)</label>
<input type="number" id="diameter" placeholder="Example: 12">

<label>Steel Length (m)</label>
<input type="number" id="steelLength" placeholder="Example: 10">

<button onclick="calculateSteel()">Calculate Steel Weight</button>

<div class="result" id="steelResult"></div>
</div>

</div>

<script>

function calculateConcrete(){

let length=parseFloat(document.getElementById("length").value);
let width=parseFloat(document.getElementById("width").value);
let depth=parseFloat(document.getElementById("depth").value);

if(isNaN(length)||isNaN(width)||isNaN(depth)){
document.getElementById("concreteResult").innerHTML="⚠️ Please enter all values.";
return;
}

let volume=length*width*depth;

document.getElementById("concreteResult").innerHTML=
"Concrete Volume = "+volume.toFixed(3)+" m³";
}


function calculateBricks(){

let length=parseFloat(document.getElementById("wallLength").value);
let height=parseFloat(document.getElementById("wallHeight").value);

if(isNaN(length)||isNaN(height)){
document.getElementById("brickResult").innerHTML="⚠️ Please enter all values.";
return;
}

let wallArea=length*height;
let bricks=wallArea*60;

document.getElementById("brickResult").innerHTML=
"Approx. Bricks Required = "+Math.ceil(bricks);
}


function calculateSteel(){

let diameter=parseFloat(document.getElementById("diameter").value);
let length=parseFloat(document.getElementById("steelLength").value);

if(isNaN(diameter)||isNaN(length)){
document.getElementById("steelResult").innerHTML="⚠️ Please enter all values.";
return;
}

let weightPerMeter=(diameter*diameter)/162;
let totalWeight=weightPerMeter*length;

document.getElementById("steelResult").innerHTML=
"Weight per metre = "+weightPerMeter.toFixed(2)+" kg/m<br>"+
"Total Steel Weight = "+totalWeight.toFixed(2)+" kg
  ";
}

</script>

</body>
</html>
